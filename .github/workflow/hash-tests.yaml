name: run-tests
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ make

      - name: Configure project
        run: |
          cmake -S . -B build

      - name: Build all tests
        run: |
          cmake --build build -j$(nproc)

      - name: Run Hopscotch tests
        run: |
          cd build && (ctest --output-on-failure -R hopscotch || ./test_hopscotch || true)

      - name: Run RobinHood tests
        run: |
          cd build && (ctest --output-on-failure -R robinhood || ./test_robinhood || true)

      - name: Run Cuckoo tests
        run: |
          cd build && (ctest --output-on-failure -R cuckoo || ./test_cuckoo || true)
